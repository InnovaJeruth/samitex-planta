<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samitex — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:       #1b2c63;
      --navy-hi:    #26408c;
      --navy-line:  rgba(130,160,220,0.16);
      --gold:       #ccab6b;
      --gold-hi:    #e4c88c;
      --gold-glow:  rgba(204,171,107,0.18);
      --bg:         #070910;
      --card:       #0f1524;
      --input:      #0b101b;
      --text:       #f4f6fb;
      --muted:      #98a1b6;
      --faint:      #5b6478;
      --danger-bg:  #2a1113;
      --danger-bd:  #5c2327;
      --danger-tx:  #f0a5a5;
      --radius:     16px;
      --ease-out:   cubic-bezier(0.23, 1, 0.32, 1);   /* ease-out fuerte para UI */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(130% 90% at 50% -10%, #101a30 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Fondo ────────────────────────────────────── */
    .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg.dots {
      background-image: radial-gradient(rgba(30,58,110,0.35) 1px, transparent 1px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(100% 90% at 50% 30%, #000 0%, transparent 72%);
              mask-image: radial-gradient(100% 90% at 50% 30%, #000 0%, transparent 72%);
    }
    .bg.diag {
      background-image: repeating-linear-gradient(45deg, rgba(26,42,94,0.10) 0 1px, transparent 1px 12px);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent);
              mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent);
    }
    .bg.glow {
      background:
        radial-gradient(60% 50% at 50% -8%, rgba(38,64,140,0.5), transparent 62%),
        radial-gradient(50% 40% at 50% 110%, var(--gold-glow), transparent 60%);
    }

    /* ── Card ─────────────────────────────────────── */
    .login { position: relative; z-index: 1; width: 100%; max-width: 416px; }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(23,32,54,0.82), rgba(13,18,30,0.9));
      border: 1px solid rgba(140,165,220,0.14);
      border-radius: var(--radius);
      padding: 44px 38px 32px;
      box-shadow: 0 30px 70px -28px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: cardIn 260ms var(--ease-out) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card::before {
      content: "";
      position: absolute; top: -1px; left: 26px; right: 26px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 2px;
    }

    /* ── Brand ────────────────────────────────────── */
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .logo {
      width: 56px; height: 56px; flex: none;
      border-radius: 15px;
      display: grid; place-items: center;
      background: linear-gradient(160deg, var(--navy-hi), var(--navy));
      border: 1px solid rgba(204,171,107,0.4);
      box-shadow: 0 10px 26px -8px rgba(26,42,94,0.9), inset 0 1px 0 rgba(255,255,255,0.08);
      font-weight: 800; font-size: 29px; color: var(--gold);
      letter-spacing: -1px; line-height: 1;
      font-family: Georgia, "Times New Roman", serif;
    }
    .brand-text h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; color: var(--text); line-height: 1.2; }
    .brand-text p  { font-size: 13.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

    /* ── Indicador ────────────────────────────────── */
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 600; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--faint);
      margin-bottom: 22px;
    }
    .eyebrow .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #3ecf7a; box-shadow: 0 0 9px rgba(62,207,122,0.9);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

    /* ── Error ────────────────────────────────────── */
    #error {
      display: none;
      align-items: center; gap: 9px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-bd);
      border-radius: 11px;
      color: var(--danger-tx);
      font-size: 13.5px; line-height: 1.5;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    #error.show { display: flex; animation: errIn 200ms var(--ease-out) both; }
    #error svg { flex: none; }
    @keyframes errIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Fields ───────────────────────────────────── */
    .field { margin-bottom: 17px; }
    .field label {
      display: block; font-size: 12.5px; font-weight: 500;
      color: var(--muted); margin-bottom: 8px; letter-spacing: 0.2px;
    }
    .input-wrap {
      position: relative; display: flex; align-items: center;
      background: var(--input);
      border: 1px solid var(--navy-line);
      border-radius: 12px;
      transition: border-color 0.16s var(--ease-out), box-shadow 0.16s var(--ease-out);
    }
    @media (hover: hover) and (pointer: fine) {
      .input-wrap:hover { border-color: rgba(150,180,235,0.32); }
    }
    .input-wrap:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }
    .input-wrap .ic {
      position: absolute; left: 14px; display: grid; place-items: center;
      color: var(--faint); pointer-events: none; transition: color 0.16s;
    }
    .input-wrap:focus-within .ic { color: var(--gold); }
    .field input {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.3;
      padding: 14px 14px 14px 44px;
    }
    .field input::placeholder { color: var(--faint); }
    .field input:-webkit-autofill {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px var(--input) inset;
      caret-color: var(--text);
    }

    /* ── Botón ────────────────────────────────────── */
    #btn {
      position: relative; width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 8px; height: 52px;
      border: none; border-radius: 12px;
      cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.2px;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold));
      color: #1c1608;
      box-shadow: 0 14px 30px -12px var(--gold-glow), 0 4px 10px -4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: filter 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out), transform 140ms var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) and (pointer: fine) {
      #btn:hover:not(:disabled) { filter: brightness(1.06); box-shadow: 0 16px 34px -10px var(--gold-glow), 0 4px 10px -4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.35); }
    }
    #btn:active:not(:disabled) { transform: scale(0.97); }
    #btn:disabled { opacity: 0.65; cursor: not-allowed; }
    #btn-text { position: relative; z-index: 1; }

    /* spinner */
    #spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(28,22,8,0.3);
      border-top-color: #1c1608;
      border-radius: 50%;
      display: none;
      animation: spin 0.6s linear infinite;
    }
    #btn.loading #spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Accesibilidad: menos movimiento (se mantienen opacidad y el spinner de carga) */
    @media (prefers-reduced-motion: reduce) {
      .card        { animation: none; }
      #error.show  { animation: none; }
      .eyebrow .dot{ animation: none; }
      #btn:active:not(:disabled) { transform: none; }
    }

    /* ── Divider + hint ───────────────────────────── */
    .divider { display: flex; align-items: center; gap: 15px; margin: 26px 0 16px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(30,58,110,0.6); }
    .divider span {
      font-size: 11px; font-weight: 600; letter-spacing: 2.2px;
      text-transform: uppercase; color: var(--gold); opacity: 0.85;
    }
    .hint {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-align: center; font-size: 12.5px; line-height: 1.5; color: var(--muted);
    }
    .hint svg { flex: none; color: var(--faint); }

    @media (max-width: 460px) { .card { padding: 32px 22px 26px; } }
  </style>
</head>
<body>

  <div class="bg glow"></div>
  <div class="bg dots"></div>
  <div class="bg diag"></div>

  <main class="login">
    <div class="card">

      <div class="brand">
        <div class="logo">S</div>
        <div class="brand-text">
          <h1>Samitex Planta</h1>
          <p>Sistema de seguimiento de producción</p>
        </div>
      </div>

      <div class="eyebrow"><span class="dot"></span>Acceso a planta</div>

      <div id="error" role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text"></span>
      </div>

      <div class="field">
        <label for="username">Usuario</label>
        <div class="input-wrap">
          <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" id="username" name="username" placeholder="Tu usuario" autocomplete="username" aria-label="Usuario">
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" aria-label="Contraseña">
        </div>
      </div>

      <button id="btn" onclick="login()">
        <span id="btn-text">Ingresar</span>
        <div id="spinner" aria-hidden="true"></div>
      </button>

      <div class="divider"><span>Samitex</span></div>
      <p class="hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Credenciales asignadas por el administrador del sistema.
      </p>

    </div>
  </main>

  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('error');
      const errText  = document.getElementById('error-text');
      const btn      = document.getElementById('btn');

      errEl.classList.remove('show');

      if (!username || !password) {
        errText.textContent = 'Ingresa usuario y contraseña';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const body = new URLSearchParams({ username, password });
        const res  = await fetch('/auth/login', {
          method: 'POST',
          body,
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        });
        const data = await res.json();
        if (res.ok) {
          const next = new URLSearchParams(window.location.search).get('next') || '/';
          window.location.href = next;
        } else {
          errText.textContent = data.detail || 'Usuario o contraseña incorrectos';
          errEl.classList.add('show');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        errText.textContent = 'Error de conexión. Intenta nuevamente.';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    window.addEventListener('load', () => document.getElementById('username').focus());
  </script>
</body>
</html>
